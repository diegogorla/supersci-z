<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Изотопный возраст извержения Везувия и исторический ориентир</title>
  <desc id="desc">Оригинальная инфографика с линейной шкалой от 1915 до 1960 лет до анализа 2025 года. Санидин даёт возраст 1938 лет с погрешностью 13 лет в каждую сторону. Приблизительный исторический ориентир — 1946 лет. Исторический допуск в два месяца не показан на годовой шкале.</desc>
  <rect width="1600" height="900" fill="#132235"/>
  <rect x="64" y="58" width="1472" height="784" rx="32" fill="#f5f1e9"/>
  <text x="112" y="126" fill="#9b422b" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">ФИЗИКА · ВЕЗУВИЙ</text>
  <text x="112" y="194" fill="#19293b" font-family="Arial, sans-serif" font-size="47" font-weight="700">Минеральные часы и история</text>
  <text x="112" y="245" fill="#45576a" font-family="Arial, sans-serif" font-size="24">Возраст в годах до анализа 2025 года; линейная шкала.</text>

  <rect x="112" y="290" width="1376" height="400" rx="22" fill="#ffffff" stroke="#d6d9d8" stroke-width="2"/>
  <text x="160" y="353" fill="#26384b" font-family="Arial, sans-serif" font-size="27" font-weight="700">Санидин: 1 938 ± 13 лет</text>
  <text x="160" y="391" fill="#536574" font-family="Arial, sans-serif" font-size="20">Интервал: 1 925–1 951 лет (±1 стандартное отклонение)</text>
  <line x1="180" y1="554" x2="1420" y2="554" stroke="#667a87" stroke-width="4"/>
  <line x1="180" y1="538" x2="180" y2="573" stroke="#667a87" stroke-width="3"/>
  <line x1="456" y1="538" x2="456" y2="573" stroke="#667a87" stroke-width="3"/>
  <line x1="731" y1="538" x2="731" y2="573" stroke="#667a87" stroke-width="3"/>
  <line x1="1007" y1="538" x2="1007" y2="573" stroke="#667a87" stroke-width="3"/>
  <line x1="1282" y1="538" x2="1282" y2="573" stroke="#667a87" stroke-width="3"/>
  <line x1="1420" y1="538" x2="1420" y2="573" stroke="#667a87" stroke-width="3"/>
  <text x="180" y="607" fill="#3d5060" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">1 915</text>
  <text x="456" y="607" fill="#3d5060" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">1 925</text>
  <text x="731" y="607" fill="#3d5060" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">1 935</text>
  <text x="1007" y="607" fill="#3d5060" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">1 945</text>
  <text x="1282" y="607" fill="#3d5060" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">1 955</text>
  <text x="1420" y="607" fill="#3d5060" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">1 960</text>

  <line x1="456" y1="476" x2="1172" y2="476" stroke="#236b8c" stroke-width="18" stroke-linecap="round"/>
  <line x1="456" y1="456" x2="456" y2="496" stroke="#236b8c" stroke-width="5"/>
  <line x1="1172" y1="456" x2="1172" y2="496" stroke="#236b8c" stroke-width="5"/>
  <circle cx="814" cy="476" r="20" fill="#236b8c" stroke="#ffffff" stroke-width="5"/>
  <text x="814" y="446" fill="#17516d" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">1 938</text>
  <line x1="1034" y1="410" x2="1034" y2="550" stroke="#b64e32" stroke-width="5" stroke-dasharray="12 9"/>
  <text x="1034" y="378" fill="#a54129" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700">Исторический ориентир: около 1 946</text>
  <text x="160" y="654" fill="#536574" font-family="Arial, sans-serif" font-size="18">Исторический ориентир приблизителен; допуск в два месяца не показан на годовой шкале.</text>

  <text x="112" y="755" fill="#26384b" font-family="Arial, sans-serif" font-size="22" font-weight="700">Результат согласуется с приблизительным ориентиром, но не устанавливает месяц извержения.</text>
  <text x="112" y="798" fill="#536574" font-family="Arial, sans-serif" font-size="17">Источник: Renne и соавт., Science Advances, DOI 10.1126/sciadv.aeg2624; Калифорнийский университет в Беркли, 25.09.2026.</text>
</svg>

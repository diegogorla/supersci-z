  <g stroke="#ff8a62" stroke-width="2" fill="#ff7356"><path d="M850 586l42-9 31 14-1 49-46 11-26-20z M850 586l26 17 16-26 M876 603l47-12 M876 603v48 M876 651l46-11 M850 631l26-28" fill="none"/><circle cx="850" cy="586" r="7"/><circle cx="892" cy="577" r="7"/><circle cx="923" cy="591" r="7"/><circle cx="922" cy="640" r="7"/><circle cx="876" cy="651" r="7"/><circle cx="850" cy="631" r="7"/><circle cx="876" cy="603" r="7"/></g>
  <text class="head" x="1008" y="243" textLength="415" lengthAdjust="spacingAndGlyphs">प्रयोगशाला में संश्लेषित</text>
  <text class="body" x="1008" y="293">Fe₅O₁₂Hₓ · Fe₇O₁₂Hₓ</text>
  <text class="head" x="1008" y="428" textLength="394" lengthAdjust="spacingAndGlyphs">प्राकृतिक अंतर्वेशन — जुइना</text>
  <text class="body muted" x="1008" y="470" textLength="399" lengthAdjust="spacingAndGlyphs">अन्य लौह ऑक्सीहाइड्रॉक्साइड</text>
  <text class="head" x="1008" y="606" textLength="420" lengthAdjust="spacingAndGlyphs">परिकल्पना: गहरा भंडार</text>
  <text class="body muted" x="1008" y="649">कोर के पास · ≈ 2,900 km</text>
  <rect x="27" y="686" width="182" height="86" rx="10" fill="#071a20" stroke="#65e5e1"/>
  <circle cx="61" cy="713" r="12" fill="#d8fa4b"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1491" height="800" viewBox="0 0 1491 800" role="img" aria-labelledby="title desc">
  <title id="title">प्रयोगशाला में बने दो लौह खनिज गहराई में जल भंडारण के संभावित माध्यम</title>
  <desc id="desc">गहरे रंग की इन्फोग्राफिक। बाईं ओर पृथ्वी के कटाव में दो अलग, परिकल्पना चिह्नित टूटी रेखाएं हैं: नारंगी रेखा आदिम मैग्मा महासागर से मेंटल के तल तक अवशेष संरक्षण और नीली रेखा सतह से तल तक सबडक्शन द्वारा पुनर्चक्रण दर्शाती है। दाईं ओर तीन खंड हैं: 1, प्रयोगशाला में बने Fe₅O₁₂Hₓ और Fe₇O₁₂Hₓ; 2, जुइना के हीरे में दूसरे लौह ऑक्सीहाइड्रॉक्साइड का प्राकृतिक अंतर्वेशन; 3, लगभग 2,900 किलोमीटर पर कोर के पास काल्पनिक गहरा भंडार।</desc>
  <defs>
    <radialGradient id="background"><stop stop-color="#12363a"/><stop offset="1" stop-color="#071a20"/></radialGradient>
    <radialGradient id="mantle"><stop stop-color="#69824e"/><stop offset="1" stop-color="#395c3c"/></radialGradient>
    <radialGradient id="outercore"><stop stop-color="#ffae55"/><stop offset="1" stop-color="#f9694b"/></radialGradient>
    <radialGradient id="innercore"><stop stop-color="#faff75"/><stop offset="1" stop-color="#c8fa3e"/></radialGradient>
    <linearGradient id="diamond" x2="1" y2="1"><stop stop-color="#e9fcff"/><stop offset=".5" stop-color="#81bfdd"/><stop offset="1" stop-color="#effbff"/></linearGradient>
    <pattern id="grid" width="73" height="67" patternUnits="userSpaceOnUse"><path d="M 73 0 H 0 V 67" fill="none" stroke="#466269" stroke-width="1" opacity=".31"/></pattern>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9Z" fill="#ff8252" stroke="#04171d" stroke-width="1"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9Z" fill="#62e1e0" stroke="#04171d" stroke-width="1"/></marker>
    <style>text{font-family:"Noto Sans",Arial,Helvetica,sans-serif;font-weight:700;fill:#f2f9f7} .small{font-size:17px} .label{font-size:22px} .head{font-size:25px;fill:#dcfb68} .body{font-size:23px} .num{font-size:38px;fill:#061a20} .cyan{fill:#65e5e1} .orange{fill:#ff8958} .muted{fill:#dbe9e9}</style>
  </defs>

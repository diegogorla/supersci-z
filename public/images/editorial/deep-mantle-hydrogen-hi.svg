  <path d="M 436 177 C 480 265 461 350 399 431" fill="none" stroke="#65e5e1" stroke-width="7" stroke-dasharray="17 11" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
  <circle cx="211" cy="193" r="13" fill="#ff8958"/>
  <circle cx="436" cy="177" r="13" fill="#65e5e1"/>

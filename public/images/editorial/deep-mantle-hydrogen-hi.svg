  <circle cx="349" cy="440" r="239" fill="url(#mantle)" stroke="#061a20" stroke-width="2"/>
  <path d="M 555 319 A 239 239 0 0 1 481 639 L 439 590 A 181 181 0 0 0 502 351 Z" fill="#ff6852" opacity=".94"/>
  <circle cx="345" cy="488" r="139" fill="url(#outercore)" stroke="#061a20" stroke-width="2"/>
  <circle cx="345" cy="488" r="73" fill="url(#innercore)" stroke="#061a20" stroke-width="2"/>
  <!-- Two independently hypothesized routes; arrows end at the core-mantle vicinity. -->
